<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Рейтинг груп</title>
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>try{if(localStorage.getItem('rating.theme')==='light')document.documentElement.setAttribute('data-theme','light')}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --bg:#000;
  --panel:#0d0b07;
  --panel-2:#16120a;
  --line:#261f12;
  --line-2:#3a301a;
  --gold:#d8b04a;
  --gold-hi:#f6de8f;
  --gold-lo:#8c6b22;
  --silver:#d6d2c6;
  --bronze:#c8834a;
  --text:#f3eee2;
  --muted:#958b76;
  --minus:#d66d52;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-ui:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif;
  --tabbar:74px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#000; --text:#f3eee2; } }
:root[data-theme="dark"]{ --bg:#000; --text:#f3eee2; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);min-height:100%}
body{
  margin:0;min-height:100%;
  background:
    radial-gradient(1100px 420px at 50% -180px, rgba(216,176,74,.13), transparent 70%),
    var(--bg);
  background-attachment:fixed;
  color:var(--text);
  font-family:var(--f-ui);
  font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--tabbar) + 24px + env(safe-area-inset-bottom,0px));
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
svg{display:block}

/* ---------- header ---------- */
.wrap{max-width:780px;margin:0 auto;padding:0 18px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;padding:34px 0 22px}
.gname{
  font-family:var(--f-display);font-weight:800;
  font-size:clamp(44px,11vw,84px);line-height:.92;letter-spacing:-.02em;
  margin:0;max-width:100%;overflow-wrap:anywhere;
  background:linear-gradient(180deg,var(--gold-hi) 0%,var(--gold) 55%,var(--gold-lo) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.meta{color:var(--muted);font-size:14px;margin-top:10px}
.meta b{color:var(--text);font-weight:700}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.btn{
  height:42px;padding:0 16px;border-radius:11px;
  border:1px solid var(--line-2);background:var(--panel-2);color:var(--text);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-weight:700;font-size:14px;white-space:nowrap;
  transition:background .15s,border-color .15s,transform .1s;
}
.btn:hover{border-color:var(--gold-lo)}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px}
.btn.primary{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#1b1405;border-color:transparent}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.icon{width:42px;padding:0}
.btn.danger{background:transparent;border-color:rgba(214,109,82,.5);color:var(--minus)}
.btn:disabled{opacity:.3;cursor:default;transform:none}

/* ---------- list ---------- */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.row{
  position:relative;
  display:grid;grid-template-columns:52px minmax(0,1fr) auto 36px;align-items:center;gap:12px;
  padding:12px 12px 12px 14px;min-height:66px;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
  will-change:transform;
}
.row.rising{z-index:2}
.rank{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rank-num{font-family:var(--f-display);font-weight:600;font-size:19px;color:var(--muted);font-variant-numeric:tabular-nums}
.crown{width:22px;height:22px;color:var(--gold-hi);display:none;margin-bottom:-2px;filter:drop-shadow(0 0 6px rgba(246,222,143,.45))}
.who{min-width:0;display:flex;align-items:center;gap:8px}
.name{font-weight:650;font-size:17px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow-wrap:anywhere;cursor:default}
.move{position:absolute;top:-10px;right:-8px;font-size:11px;font-weight:800;color:#1b1405;background:var(--gold-hi);padding:1px 5px;border-radius:6px;opacity:0;transform:translateY(4px);pointer-events:none;white-space:nowrap}
.move.show{animation:chip 1.9s ease forwards}
@keyframes chip{12%{opacity:1;transform:none}75%{opacity:1;transform:none}100%{opacity:0}}

.ctrl{display:flex;align-items:center;gap:6px}
.score{
  font-family:var(--f-display);font-weight:700;font-size:22px;
  min-width:2.6ch;text-align:center;font-variant-numeric:tabular-nums;
  display:inline-block;
}
.row.zero .score{color:var(--muted)}
.score.neg{color:var(--minus)}
.score.bump{animation:bump .42s cubic-bezier(.2,.9,.3,1.5)}
.score.dip{animation:dip .38s ease}
@keyframes bump{35%{transform:scale(1.32);color:var(--gold-hi);text-shadow:0 0 18px rgba(246,222,143,.6)}}
@keyframes dip{35%{transform:translateY(3px) scale(.9);color:var(--minus)}}

.step{
  width:40px;height:40px;border-radius:50%;
  border:1px solid var(--line-2);background:transparent;
  display:grid;place-items:center;font-size:22px;font-weight:500;line-height:1;
  transition:background .12s,transform .08s,border-color .12s;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
.step:active{transform:scale(.86)}
.step.minus{color:var(--muted)}
.step.minus:hover{border-color:rgba(214,109,82,.55);color:var(--minus)}
.step.plus{border-color:var(--gold-lo);color:var(--gold-hi);background:rgba(216,176,74,.08)}
.step.plus:hover{background:rgba(216,176,74,.2)}
.more{width:36px;height:36px;border-radius:10px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center}
.more:hover{background:var(--panel-2);color:var(--text)}
.more svg{width:18px;height:18px}

/* medals */
.row.medal::before{content:"";position:absolute;left:-1px;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--m)}
.row.r2{--m:var(--silver);border-color:rgba(214,210,198,.22)}
.row.r3{--m:var(--bronze);border-color:rgba(200,131,74,.25)}
.row.r2 .rank-num{color:var(--silver)}
.row.r3 .rank-num{color:var(--bronze)}
.row.r1{
  --m:var(--gold-hi);
  min-height:84px;padding-top:16px;padding-bottom:16px;
  border:1.5px solid transparent;
  background:
    linear-gradient(180deg,#1c170c,#110e07) padding-box,
    linear-gradient(115deg,var(--gold-hi),var(--gold-lo) 35%,var(--gold) 65%,var(--gold-lo)) border-box;
  box-shadow:0 10px 40px -18px rgba(216,176,74,.55);
}
.row.r1 .crown{display:block}
.row.r1 .rank-num{color:var(--gold-hi);font-size:24px}
.row.r1 .name{font-size:19px;font-weight:800}
.row.r1 .score{
  font-size:28px;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.row.r1 .score.bump{animation:bump1 .42s cubic-bezier(.2,.9,.3,1.5)}
@keyframes bump1{35%{transform:scale(1.3)}}

.row.promote::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(100deg,transparent 30%,rgba(246,222,143,.28) 50%,transparent 70%) no-repeat;
  background-size:250% 100%;background-position:120% 0;
  animation:sweep 1.1s .25s ease-out forwards;
}
@keyframes sweep{to{background-position:-120% 0}}
.row.enter{animation:enter .42s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes enter{from{opacity:0;transform:translateY(10px) scale(.985)}}
.row.leaving{animation:leave .22s ease-in forwards}
@keyframes leave{to{opacity:0;transform:translateX(24px) scale(.97)}}

/* ---------- empty / hero ---------- */
.empty{text-align:center;padding:48px 20px;border:1px dashed var(--line-2);border-radius:16px;color:var(--muted)}
.empty p{margin:0 0 18px}
.hero{min-height:calc(100vh - 160px);display:grid;place-content:center;text-align:center;padding:24px}
.hero h1{
  font-family:var(--f-display);font-weight:800;font-size:clamp(52px,14vw,120px);line-height:.9;margin:0 0 18px;letter-spacing:-.03em;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,var(--gold-lo));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero p{color:var(--muted);margin:0 auto 26px;max-width:34ch}
.loading{color:var(--muted);text-align:center;padding:80px 0}
[hidden]{display:none!important}

/* ---------- tab bar ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:rgba(0,0,0,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));
}
.tabbar::before{content:"";position:absolute;left:0;right:0;top:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-lo),transparent)}
.tabbar-in{max-width:744px;margin:0 auto;display:flex;gap:8px;align-items:center}
.tabs{flex:1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:none;height:46px;padding:0 16px;border-radius:12px;
  border:1px solid var(--line-2);background:transparent;color:var(--muted);
  display:flex;align-items:center;gap:9px;
  font-family:var(--f-display);font-weight:600;font-size:15px;
  transition:color .15s,border-color .15s,background .15s;
}
.tab:hover{color:var(--text);border-color:var(--gold-lo)}
.tab-cnt{font-family:var(--f-ui);font-size:12px;font-weight:700;opacity:.65}
.tab.active{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#1b1405;border-color:transparent}
.tab.active.has-more{border-radius:12px 0 0 12px}
.tab-more{
  flex:none;height:46px;width:34px;margin-left:-6px;border-radius:0 12px 12px 0;
  border:0;border-left:1px solid rgba(27,20,5,.25);
  background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#1b1405;
  display:grid;place-items:center;
}
.tab-more svg{width:16px;height:16px}
.tab-add{
  flex:none;height:46px;width:46px;border-radius:12px;
  border:1px dashed var(--gold-lo);background:transparent;color:var(--gold-hi);
  display:grid;place-items:center;
}
.tab-add:hover{background:rgba(216,176,74,.1)}
.tab-add svg{width:20px;height:20px}

/* ---------- menus, modals, toast ---------- */
.menu{
  position:fixed;z-index:70;min-width:200px;padding:6px;
  background:var(--panel-2);border:1px solid var(--line-2);border-radius:12px;
  box-shadow:0 20px 50px rgba(0,0,0,.7);
  animation:pop .14s ease-out;
}
.menu-item{display:block;width:100%;text-align:left;padding:11px 12px;border:0;background:transparent;border-radius:8px;font-weight:600;font-size:15px}
.menu-item:hover,.menu-item:focus-visible{background:rgba(216,176,74,.1);outline:none}
.menu-item.danger{color:var(--minus)}

.scrim{
  position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;
  background:rgba(0,0,0,.72);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
  animation:fade .18s ease;
}
.scrim.out{animation:fade .16s ease reverse forwards}
.sheet{
  width:min(460px,100%);max-height:calc(100% - 20px);overflow:auto;
  background:linear-gradient(180deg,#1a150c,#110e08);
  border:1px solid var(--line-2);border-radius:18px;padding:22px;
  box-shadow:0 40px 100px rgba(0,0,0,.75);
  animation:pop .24s cubic-bezier(.2,.9,.3,1.2);
}
.sheet-title{font-family:var(--f-display);font-weight:700;font-size:20px;margin:0 0 16px;line-height:1.2}
.sheet-text{color:var(--muted);margin:-6px 0 18px}
.sheet-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.field{
  width:100%;height:48px;padding:0 14px;border-radius:12px;
  border:1px solid var(--line-2);background:#000;color:var(--text);
  font:600 17px var(--f-ui);
}
.field:focus{outline:none;border-color:var(--gold)}
.field.err{border-color:var(--minus)}
textarea.field{height:auto;padding:12px 14px;resize:vertical;line-height:1.5;font-weight:500}
.hint{color:var(--muted);font-size:13px;margin:10px 2px 0;min-height:1.2em}
.hint.ok{color:var(--gold-hi)}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:#000;border:1px solid var(--line-2);margin-bottom:12px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:8px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--panel-2);color:var(--gold-hi)}

.slot{
  position:relative;height:104px;margin:6px 0 8px;border-radius:14px;
  background:#000;border:1px solid var(--line-2);
  display:grid;place-items:center;overflow:hidden;transition:border-color .3s,box-shadow .3s;
}
.slot-name{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,6vw,27px);line-height:1.15;text-align:center;padding:0 16px;overflow-wrap:anywhere}
.slot-name.idle{color:var(--muted);font-size:16px;font-family:var(--f-ui)}
.slot-name.tick{animation:tick var(--d,120ms) ease-out}
@keyframes tick{from{transform:translateY(55%);opacity:.15}}
.slot.landed{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold),0 0 44px rgba(216,176,74,.22)}
.slot.landed .slot-name{color:var(--gold-hi);animation:land .55s cubic-bezier(.2,.9,.3,1.5)}
@keyframes land{from{transform:scale(.8)}}
.slot-sub{text-align:center;color:var(--muted);font-size:14px;margin:0 0 14px;min-height:1.4em}
.check{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--muted);cursor:pointer}
.check input{accent-color:var(--gold);width:18px;height:18px}
.picker-actions{justify-content:space-between}
.picker-actions .btn.primary{flex:1}

.hist{list-style:none;margin:0;padding:0;max-height:320px;overflow:auto}
.hist li{display:flex;justify-content:space-between;padding:10px 2px;border-bottom:1px solid var(--line)}
.hist li:last-child{border-bottom:0}
.hist .d{font-family:var(--f-display);font-weight:700}
.hist .d.up{color:var(--gold-hi)}
.hist .d.down{color:var(--minus)}
.hist .t{color:var(--muted);font-size:14px}

.toast{
  position:fixed;left:50%;bottom:calc(var(--tabbar) + 18px + env(safe-area-inset-bottom,0px));z-index:40;
  transform:translate(-50%,20px);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:12px;max-width:calc(100% - 24px);
  padding:11px 12px 11px 16px;border-radius:14px;
  background:#1d180d;border:1px solid var(--gold-lo);box-shadow:0 20px 50px rgba(0,0,0,.7);
  font-weight:650;font-size:15px;transition:opacity .2s,transform .25s cubic-bezier(.2,.9,.3,1.2);
}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast svg{width:20px;height:20px;color:var(--gold-hi);flex:none}
.toast button{border:0;background:rgba(216,176,74,.15);color:var(--gold-hi);font-weight:800;padding:7px 12px;border-radius:9px;flex:none}
.banner{margin:0 0 14px;padding:10px 14px;border-radius:12px;border:1px solid var(--line-2);color:var(--muted);font-size:14px}

.spark{position:fixed;z-index:80;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;pointer-events:none;background:var(--gold-hi);box-shadow:0 0 10px var(--gold);animation:spark .85s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.floater{position:fixed;z-index:80;pointer-events:none;font-family:var(--f-display);font-weight:800;font-size:17px;color:var(--gold-hi);transform:translate(-50%,-50%);animation:floatup .8s ease-out forwards;text-shadow:0 0 12px rgba(216,176,74,.6)}
.floater.neg{color:var(--minus);text-shadow:none}
@keyframes floatup{to{transform:translate(-50%,-190%);opacity:0}}
@keyframes pop{from{transform:scale(.95);opacity:0}}
@keyframes fade{from{opacity:0}}

/* read-only */
.ro .edit-only{display:none!important}
.ro .row{grid-template-columns:52px minmax(0,1fr) auto;cursor:pointer}
.ro .row:hover{border-color:var(--gold-lo)}
.ro .row .name{cursor:pointer}
.upd{display:block;margin-top:4px;font-size:12px;opacity:.75}
.upd:empty{display:none}
.sync{color:var(--muted);font-size:12px;margin-top:6px;display:flex;align-items:center;gap:6px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold)}
.sync.busy::before{animation:blink .8s ease-in-out infinite alternate}
.sync.err{color:var(--minus)}
.sync.err::before{background:var(--minus)}
@keyframes blink{to{opacity:.2}}
#authBtn .i-open{display:none}
.owner #authBtn .i-lock{display:none}
.owner #authBtn .i-open{display:block}
.owner #authBtn{color:var(--gold-hi);border-color:var(--gold-lo)}
.sheet-text a{color:var(--gold-hi)}

/* хто я */
.me-line{color:var(--text);margin-bottom:4px}
.me-line b{color:var(--gold-hi)}
.link{border:0;background:none;padding:0;color:var(--gold-hi);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.ro .row.me{border-color:var(--gold-lo);box-shadow:inset 0 0 0 1px var(--gold-lo)}
.me-tag{display:none;flex:none;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:rgba(216,176,74,.16);color:var(--gold-hi)}
.ro .row.me .me-tag{display:inline-block}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.pick-grid button{height:56px;border-radius:12px;border:1px solid var(--line-2);background:var(--panel-2);font-family:var(--f-display);font-weight:700;font-size:18px}
.pick-grid button:hover,.pick-list button:hover{border-color:var(--gold)}
.pick-list{display:flex;flex-direction:column;gap:6px;max-height:min(48vh,420px);overflow:auto;margin-top:10px}
.pick-list button{text-align:left;padding:12px 14px;border-radius:11px;border:1px solid var(--line-2);background:var(--panel-2);font-weight:650;font-size:16px}
.pick-list .none{color:var(--muted);padding:10px 2px}
[data-theme="light"] .pick-grid button,[data-theme="light"] .pick-list button{background:#fff;border:2px solid #555}
.steps{color:var(--muted);font-size:14px;margin:-8px 0 16px;padding-left:20px;line-height:1.55}
.steps b{color:var(--text)}

@media (max-width:480px){
  .wrap{padding:0 12px}
  .top{padding:24px 0 18px}
  .row{grid-template-columns:38px minmax(0,1fr) auto 30px;gap:8px;padding:10px 6px 10px 10px}
  .ro .row{grid-template-columns:38px minmax(0,1fr) auto}
  .step{width:38px;height:38px}
  .name{font-size:16px}
  .row.r1 .name{font-size:17px}
  .score{font-size:20px}
  .row.r1 .score{font-size:24px}
  .rank-num{font-size:16px}
  .row.r1 .rank-num{font-size:20px}
  .more{width:30px}
  .btn .lbl-long{display:none}
}

/* ===================== ПРОЕКТОР: світла контрастна тема ===================== */
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#ffffff;
  --panel:#ffffff;
  --panel-2:#f2f2f2;
  --line:#a79f8c;
  --line-2:#111111;
  --gold:#f5b800;
  --gold-hi:#b87d00;
  --gold-lo:#7a5400;
  --silver:#a9b0b9;
  --bronze:#dd7a2c;
  --text:#0a0a0a;
  --muted:#3d3d3d;
  --minus:#c0261a;
}
[data-theme="light"] body{background:#fff}
[data-theme="light"] .gname,
[data-theme="light"] .hero h1{
  background:none;-webkit-background-clip:border-box;background-clip:border-box;color:#0a0a0a;
  text-decoration:underline;text-decoration-color:#f5b800;text-decoration-thickness:.12em;text-underline-offset:.14em;
}
[data-theme="light"] .meta{font-size:16px;font-weight:600}

<body>

<script>
(() => {
'use strict';

/* ================= state ================= */
const LS_KEY = 'rating.v1', LS_ACTIVE = 'rating.active', LS_TOKEN = 'rating.gh.token', LS_PENDING = 'rating.pending';
const LS_ME = 'rating.me', LS_SKIP = 'rating.me.skip';
// де лежать бали: репозиторій, з якого GitHub Pages віддає цю сторінку
const GH = { owner: 'phys-kpkb', repo: 'gamma', branch: 'main', path: 'data.json' };

// адреси на кшталт …/gamma/201: GitHub Pages віддає на них 404.html, а той передає шлях сюди
const BASE = (location.pathname.match(/^.*\//) || ['/'])[0];
(() => {
  let p = null;
  try { p = sessionStorage.getItem('rating.path'); sessionStorage.removeItem('rating.path'); } catch {}
  if (p && p.startsWith(BASE)) history.replaceState(null, '', p);
})();
let START_GROUP = '';   // група з адреси, з якою відкрили сторінку
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clone = o => JSON.parse(JSON.stringify(o));
const sleep = ms => new Promise(r => setTimeout(r, ms));

let groups = [];
let activeId = lsGet(LS_ACTIVE);
let me = null, askedMe = false;
try { const m = JSON.parse(lsGet(LS_ME) || 'null'); if (m && m.g && m.s) me = { g: String(m.g), s: String(m.s) }; } catch {}
let readOnly = false;
const store = { mode: 'local', db: null, pending: false };
const gh = { token: null, sha: null, timer: null, saving: false, again: false, labels: [], updated: 0, poll: null, failed: false };
const ver = {};
const dirty = new Set(), timers = {}, inflight = {}, again = new Set();
let lastRemote = null, sawDefinitive = false;
const undoStack = [];

// render memory (for animations)
let renderedGroup = null, lastPos = new Map(), lastMedal = new Set(), lastLeader = null;

const ICON = {
  dots: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>',
  crown: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 7.5l4.6 4L12 4l4.4 7.5L21 7.5 19.2 18H4.8z"/><rect x="4.8" y="19" width="14.4" height="2" rx="1"/></svg>',
  undo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>'
};

function lsGet(k){ try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch {} }

function normStudent(s){
  return { id: String(s.id), name: String(s.name ?? ''), score: Number(s.score) || 0,
           picks: Number(s.picks) || 0, log: Array.isArray(s.log) ? s.log.slice(-30) : [] };
}
function normGroup(id, g){
  return { id: String(id), name: String(g.name ?? ''), order: Number(g.order) || 0,
           students: Array.isArray(g.students) ? g.students.map(normStudent) : [] };
}
function serialize(g){
  return { name: g.name, order: g.order,
           students: g.students.map(s => ({ id: s.id, name: s.name, score: s.score, picks: s.picks, log: s.log })) };
}
const byOrder = (a, b) => a.order - b.order || a.name.localeCompare(b.name, 'uk');

function loadLocal(){
  try {
    const d = JSON.parse(lsGet(LS_KEY) || 'null');
    if (d && Array.isArray(d.groups)) groups = d.groups.map(g => normGroup(g.id, g)).sort(byOrder);
  } catch {}
}
function saveLocal(){
  lsSet(LS_KEY, JSON.stringify({ groups: groups.map(g => ({ id: g.id, ...serialize(g) })) }));
  if (store.mode === 'gh') lsSet(LS_PENDING, JSON.stringify([...dirty]));
}

const activeGroup = () => groups.find(g => g.id === activeId) || null;

/* ================= persistence ================= */
function markDirty(gid){
  dirty.add(gid);
  ver[gid] = (ver[gid] || 0) + 1;
  saveLocal();
  if (store.mode === 'gh') { ghSchedule(); return; }
  clearTimeout(timers[gid]);
  timers[gid] = setTimeout(() => { timers[gid] = null; flush(gid); }, 400);
}

async function flush(gid){
  if (store.mode !== 'db') { dirty.delete(gid); return; }
  if (inflight[gid]) { again.add(gid); return; }
  inflight[gid] = true;
  const g = groups.find(x => x.id === gid);
  const ref = store.db.collection('groups').doc(gid);
  try { await write(ref, g ? serialize(g) : null); }
  catch (e) { onWriteError(e); }
  inflight[gid] = false;
  if (again.has(gid)) { again.delete(gid); return flush(gid); }
  if (!timers[gid]) dirty.delete(gid);
}

async function write(ref, body, retry = true){
  try { body ? await ref.set(clone(body)) : await ref.delete(); }
  catch (e) {
    if (retry && (!e || e.code === 'unavailable')) { await sleep(500 + Math.random() * 900); return write(ref, body, false); }
    throw e;
  }
}

function onWriteError(e){
  const code = e && e.code;
  if (code === 'invalid_argument' || code === 'not_granted' || code === 'revoked') {
    setReadOnly(true);
    dirty.clear();
    if (lastRemote) applyRemote();
    toast('Змінювати рейтинг тут можна тільки власнику.');
  } else if (code === 'quota_exceeded') {
    toast('Сховище заповнене. Видаліть старі групи, щоб зберігати нові.');
  } else {
    toast('Не вдалося зберегти в хмару. Зміни лишились на цьому пристрої.');
  }
}

function onGroups(snap){
  const cached = snap.metadata && snap.metadata.fromCache;
  if (cached && !sawDefinitive && snap.empty) return;
  const firstDefinitive = !cached && !sawDefinitive;
  if (!cached) sawDefinitive = true;
  store.pending = false;
  lastRemote = new Map(snap.docs.map(d => [d.id, d.data()]));
  // first cloud load with an empty store: upload whatever lives on this device
  if (firstDefinitive && snap.empty && groups.length && !readOnly) {
    groups.forEach(g => markDirty(g.id));
    renderAll();
    return;
  }
  applyRemote();
}

function applyRemote(opts){
  const next = [];
  for (const [id, data] of lastRemote) {
    if (dirty.has(id)) { const l = groups.find(g => g.id === id); if (l) next.push(l); }
    else next.push(normGroup(id, clone(data)));
  }
  for (const g of groups) if (dirty.has(g.id) && !lastRemote.has(g.id)) next.push(g);
  groups = next.sort(byOrder);
  pickFromHash();
  if (!activeGroup() && readOnly && meStudent()) activeId = me.g;
  if (!activeGroup()) activeId = groups[0] ? groups[0].id : null;
  saveLocal();
  renderAll(opts);
}

/* ================= GitHub: data.json у репозиторії ================= */
// Учні читають data.json без жодних прав. Писати може лише той,
// у кого є токен із доступом на запис до цього репозиторію.
const RAW_URL = 'https://raw.githubusercontent.com/' + GH.owner + '/' + GH.repo + '/' + GH.branch + '/' + GH.path;
const API_URL = 'https://api.github.com/repos/' + GH.owner + '/' + GH.repo + '/contents/' + GH.path;

function b64encode(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64decode(b64){
  const bin = atob(b64.replace(/\s/g, ''));
  return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
}

// один студент на рядок — щоб в історії комітів було видно, кому що змінилось
function toFile(updated){
  const J = o => JSON.stringify(o);
  const gs = groups.map(g => {
    const head = J({ id: g.id, name: g.name, order: g.order });
    const st = g.students.map(s => '  ' + J({ id: s.id, name: s.name, score: s.score, picks: s.picks, log: s.log }));
    return head.slice(0, -1) + ',"students":[' + (st.length ? '\n' + st.join(',\n') + '\n' : '') + ']}';
  });
  return '{"updated":' + updated + ',"groups":[\n' + gs.join(',\n') + '\n]}\n';
}

function ghFetch(url, opt = {}){
  return fetch(url, { ...opt, cache: 'no-store', headers: {
    Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + gh.token,
    'X-GitHub-Api-Version': '2022-11-28', ...(opt.headers || {}) } });
}

function takeRemote(data, opts){
  if (!data || !Array.isArray(data.groups)) return false;
  gh.updated = Number(data.updated) || 0;
  lastRemote = new Map(data.groups.map(g => [String(g.id), g]));
  store.pending = false;
  applyRemote(opts);
  return true;
}

// перегляд: Pages оновлюється з затримкою, raw — свою; беремо свіжіший
async function viewerPull(){
  if (store.mode !== 'view') return;
  const t = '?t=' + Date.now();
  const get = u => fetch(u + t, { cache: 'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null);
  const res = (await Promise.all([get(GH.path), get(RAW_URL)])).filter(d => d && Array.isArray(d.groups));
  if (store.mode !== 'view') return;
  if (!res.length) { if (store.pending) { store.pending = false; renderAll(); } return; }
  const best = res.reduce((a, b) => (Number(b.updated) || 0) > (Number(a.updated) || 0) ? b : a);
  if (lastRemote && (Number(best.updated) || 0) <= gh.updated) { renderUpdated(); return; }
  takeRemote(best, { effects: true });
  maybeOnboard();
}

async function ownerPull(){
  const r = await ghFetch(API_URL + '?ref=' + encodeURIComponent(GH.branch));
  if (r.status === 404) { gh.sha = null; return { missing: true }; }
  if (!r.ok) throw Object.assign(new Error('pull'), { status: r.status });
  const j = await r.json();
  if (j.sha === gh.sha && lastRemote) return {};
  gh.sha = j.sha;
  takeRemote(JSON.parse(b64decode(j.content)), { effects: true });
  return {};
}

function ghSchedule(){
  clearTimeout(gh.timer);
  setSync('pending');
  gh.timer = setTimeout(() => { gh.timer = null; ghSave(); }, 2500);
}

async function ghSave(){
  if (store.mode !== 'gh' || !dirty.size) { if (!dirty.size) setSync('ok'); return; }
  if (gh.saving) { gh.again = true; return; }
  gh.saving = true; setSync('saving');
  const sent = new Map([...dirty].map(id => [id, ver[id]]));
  const labels = gh.labels.splice(0);
  try {
    let r = await ghPut(labels);
    if (r.status === 409 || r.status === 422) {
      // файл змінився з іншого пристрою: підтягуємо, наші групи лишаються зверху
      await ownerPull();
      r = await ghPut(labels);
    }
    if (!r.ok) throw Object.assign(new Error('save'), { status: r.status });
    gh.sha = (await r.json()).content.sha;
    for (const [id, v] of sent) if (ver[id] === v) dirty.delete(id);
    saveLocal();
    gh.failed = false;
  } catch (e) {
    gh.labels.unshift(...labels);
    ghError(e);
  }
  gh.saving = false;
  if (store.mode !== 'gh') return;
  if (gh.again || (dirty.size && !gh.timer && !gh.failed)) { gh.again = false; ghSchedule(); }
  else if (!dirty.size) setSync('ok');
}

function ghPut(all){
  gh.updated = Date.now();
  const labels = [];
  all.forEach(l => { const p = labels[labels.length - 1]; if (p && p.l === l) p.n++; else labels.push({ l, n: 1 }); });
  labels.forEach((x, i) => { labels[i] = x.n > 1 ? x.l + ' ×' + x.n : x.l; });
  const msg = labels.length
    ? 'Рейтинг: ' + labels.slice(0, 4).join('; ') + (labels.length > 4 ? ' і ще ' + (labels.length - 4) : '')
    : 'Рейтинг: оновлення';
  const body = { message: msg, content: b64encode(toFile(gh.updated)), branch: GH.branch };
  if (gh.sha) body.sha = gh.sha;
  return ghFetch(API_URL, { method: 'PUT', body: JSON.stringify(body) });
}

function ghError(e){
  const st = e && e.status;
  if (st === 401) {
    toast('Токен більше не дійсний. Увійдіть ще раз.');
    logout(true);
    return;
  }
  gh.failed = true;
  setSync('err');
  if (st === 403 || st === 404) toast('У токена немає права запису в репозиторій ' + GH.owner + '/' + GH.repo + '.');
  else toast('Не вдалося зберегти. Зміни лишились на цьому пристрої, спробую ще раз.');
  clearTimeout(gh.timer);
  gh.timer = setTimeout(() => { gh.timer = null; gh.failed = false; ghSave(); }, 15000);
}

function setSync(state){
  const el = $('#sync');
  if (store.mode !== 'gh') { el.hidden = true; return; }

  el.textContent = state === 'saving' ? 'Зберігаю…' : state === 'pending' ? 'Є незбережені зміни'
    : state === 'err' ? 'Не збережено' : 'Усе збережено. Учні побачать за хвилину-дві';
}

/* ================= mutations & undo ================= */
function mutate(label, gids, fn){
  if (readOnly) return false;
  undoStack.push({ label, groups: clone(groups), activeId });
  if (undoStack.length > 50) undoStack.shift();
  if (store.mode === 'gh') gh.labels.push(label);
  fn();
  gids.forEach(markDirty);
  updateUndo();
  return true;
}

function undo(){
  const u = undoStack.pop();
  if (!u || readOnly) return;
  const ids = new Set([...groups.map(g => g.id), ...u.groups.map(g => g.id)]);
  groups = u.groups;
  if (store.mode === 'gh') gh.labels.push('скасовано ' + u.label);
  activeId = groups.some(g => g.id === u.activeId) ? u.activeId : (groups[0] ? groups[0].id : null);
  ids.forEach(markDirty);
  renderAll();
  updateUndo();
  toast('Скасовано: ' + u.label, { icon: ICON.undo });
}

function updateUndo(){
  const b = $('#undoBtn');
  const u = undoStack[undoStack.length - 1];
  b.disabled = !u;
  b.title = u ? 'Скасувати: ' + u.label + ' (Ctrl+Z)' : 'Нічого скасовувати';
}

function addLog(s, d, reset){
  const now = Date.now(), last = s.log[s.log.length - 1];
  if (!reset && last && !last.r && now - last.t < 90000 && Math.sign(last.d) === Math.sign(d)) { last.d += d; last.t = now; }
  else s.log.push(reset ? { d, t: now, r: 1 } : { d, t: now });
  if (s.log.length > 30) s.log.splice(0, s.log.length - 30);
}

/* ================= helpers ================= */
function plural(n, f){
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return f[2];
  if (b > 1 && b < 5) return f[1];
  if (b === 1) return f[0];
  return f[2];
}
const STUD = ['студент', 'студенти', 'студентів'];
const PTS = ['бал', 'бали', 'балів'];
const TIMES = ['раз', 'рази', 'разів'];

function ranked(students){
  const arr = [...students].sort((a, b) => b.score - a.score || a.name.localeCompare(b.name, 'uk'));
  let rank = 0, prev = null;
  arr.forEach((s, i) => { if (s.score !== prev) { rank = i + 1; prev = s.score; } s._rank = rank; });
  return arr;
}
const medalOf = s => (s.score > 0 && s._rank <= 3) ? s._rank : 0;
function leaderOf(sorted){
  const a = sorted[0], b = sorted[1];
  return a && a.score > 0 && (!b || b.score < a.score) ? a.id : null;
}

function renderList(opts = {}){
  const list = $('#list');
  const g = activeGroup();
  if (!g) { list.innerHTML = ''; renderedGroup = null; return; }
  const switched = renderedGroup !== g.id;
  if (switched) list.innerHTML = '';

  const firstTop = new Map();
  if (!switched && !reduced) for (const el of list.children) firstTop.set(el.dataset.id, el.getBoundingClientRect().top);

  const sorted = ranked(g.students);
  const existing = new Map([...list.children].map(el => [el.dataset.id, el]));
  const fresh = new Set();
  sorted.forEach((s, i) => {
    let el = existing.get(s.id);
    if (!el) { el = createRow(s.id); fresh.add(s.id); }
    updateRow(el, s);
    if (list.children[i] !== el) list.insertBefore(el, list.children[i] || null);
    existing.delete(s.id);
  });
  existing.forEach(el => el.remove());

  if (!reduced) {
    if (switched) {
      [...list.children].forEach((el, i) => playEnter(el, Math.min(i, 16) * 30));
    } else {
      for (const el of list.children) {
        if (fresh.has(el.dataset.id)) { playEnter(el, 0); continue; }
        const t0 = firstTop.get(el.dataset.id);
        if (t0 == null) continue;
        const dy = t0 - el.getBoundingClientRect().top;
        if (Math.abs(dy) < 1) continue;
        el.style.transition = 'none';
        el.style.transform = 'translateY(' + dy + 'px)';
        el.classList.toggle('rising', dy > 0);
        requestAnimationFrame(() => requestAnimationFrame(() => {
          el.style.transition = 'transform 580ms cubic-bezier(.2,.75,.15,1)';
          el.style.transform = '';
        }));
        const done = e => {
          if (e.propertyName !== 'transform') return;
          el.style.transition = ''; el.classList.remove('rising');
          el.removeEventListener('transitionend', done);
        };
        el.addEventListener('transitionend', done);
      }
    }
  }

  // rank-change effects
  const leader = leaderOf(sorted);
  if (opts.effects && !switched) {
    const promoted = [];
    sorted.forEach((s, i) => {
      const p = lastPos.get(s.id);
      const el = list.children[i];
      if (p != null && i < p) showMove(el, p - i);
      if (medalOf(s) && !lastMedal.has(s.id) && p != null) {
        el.classList.remove('promote'); void el.offsetWidth; el.classList.add('promote');
        promoted.push(el);
      }
    });
    if (leader && leader !== lastLeader) {
      const s = sorted[0];
      toast((lastLeader ? 'Новий лідер: ' : 'Перший лідер групи: ') + s.name, { icon: ICON.crown });
      setTimeout(() => { const c = list.children[0] && list.children[0].querySelector('.crown'); if (c) burstAt(c, 22); }, 480);
    } else if (promoted.length) {
      setTimeout(() => promoted.forEach(el => burstAt(el.querySelector('.rank-num'), 12)), 480);
    }
  }

  lastPos = new Map(sorted.map((s, i) => [s.id, i]));
  lastMedal = new Set(sorted.filter(medalOf).map(s => s.id));
  lastLeader = leader;
  renderedGroup = g.id;
  $('#empty').hidden = g.students.length > 0;
}

function playEnter(el, delay){
  el.style.animationDelay = delay + 'ms';
  el.classList.add('enter');
  el.addEventListener('animationend', function h(e){
    if (e.animationName !== 'enter') return;
    el.classList.remove('enter'); el.style.animationDelay = '';
    el.removeEventListener('animationend', h);
  });
}

function showMove(el, n){
  const m = el.querySelector('.move');
  m.textContent = '▲' + n;
  m.classList.remove('show'); void m.offsetWidth; m.classList.add('show');
}

function restartClass(el, cls){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

/* ================= effects ================= */
function burstAt(el, n){
  if (reduced || !el) return;
  const r = el.getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2, n);
}
function burst(x, y, n = 12){
  if (reduced) return;
  for (let i = 0; i < n; i++) {
    const p = document.createElement('i');
    p.className = 'spark';
    const a = Math.random() * Math.PI * 2, r = 34 + Math.random() * 70;
    p.style.left = x + 'px'; p.style.top = y + 'px';
    p.style.setProperty('--dx', Math.cos(a) * r + 'px');
    p.style.setProperty('--dy', Math.sin(a) * r + 'px');
    if (Math.random() < .35) p.style.background = '#fff4cc';
    document.body.appendChild(p);
    p.addEventListener('animationend', () => p.remove());
  }
}
function floater(src, d){
  if (reduced || !src) return;
  const r = src.getBoundingClientRect();
  const f = document.createElement('span');
  f.className = 'floater' + (d < 0 ? ' neg' : '');
  f.textContent = d > 0 ? '+' + d : '−' + Math.abs(d);
  f.style.left = r.left + r.width / 2 + 'px';
  f.style.top = r.top + 'px';
  document.body.appendChild(f);
  f.addEventListener('animationend', () => f.remove());
}

let toastTimer;
function toast(msg, { action, run, icon } = {}){
  const t = $('#toast');
  t.innerHTML = '';
  if (icon) t.insertAdjacentHTML('beforeend', icon);
  const s = document.createElement('span'); s.textContent = msg; t.appendChild(s);
  const hide = () => t.classList.remove('show');
  if (action) {
    const b = document.createElement('button');
    b.textContent = action;
    b.onclick = () => { hide(); run(); };
    t.appendChild(b);
  }
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hide, action ? 6000 : 2800);
}

async function newGroup(){
  if (readOnly) return;
  const name = await ask({ title: 'Нова група', placeholder: 'Наприклад, 101', ok: 'Створити' });
  if (!name) return;
  const id = uid();
  const order = groups.reduce((m, g) => Math.max(m, g.order), 0) + 1;
  mutate('нова група ' + name, [id], () => { groups.push({ id, name, order, students: [] }); groups.sort(byOrder); });
  activeId = id;
  renderAll();
  addStudentsDialog();
}

async function renameGroup(id){
  if (readOnly) return;

  const name = await ask({ title: 'Перейменувати групу', value: g.name, ok: 'Зберегти' });
  if (!name || name === g.name) return;
  const cur = groups.find(x => x.id === id); if (!cur) return;
  mutate('перейменування групи', [id], () => { cur.name = name; });
  renderAll();
}

async function deleteGroup(id){
  const g = groups.find(x => x.id === id); if (!g) return;
  const n = g.students.length;
  const yes = await confirmDialog({
    title: 'Видалити групу «' + g.name + '»?',
    text: n ? 'Разом із нею зникнуть ' + n + ' ' + plural(n, STUD) + ' і всі бали.' : 'Група порожня.',
    ok: 'Видалити', danger: true
  });

  mutate('видалення групи ' + g.name, [id], () => { groups = groups.filter(x => x.id !== id); });

async function resetGroup(id){
  const g = groups.find(x => x.id === id); if (!g) return;
  const yes = await confirmDialog({
    title: 'Обнулити бали в «' + g.name + '»?',
    text: 'Студенти лишаться, усі рахунки стануть 0. Наприклад, на початку нового семестру.',

/* ================= menus & dialogs ================= */
let menuEl = null;
function closeMenu(){
  if (!menuEl) return;
  menuEl.remove(); menuEl = null;
  document.removeEventListener('pointerdown', menuOutside, true);
  document.removeEventListener('keydown', menuKey, true);
}
function menuOutside(e){ if (menuEl && !menuEl.contains(e.target)) closeMenu(); }
function menuKey(e){ if (e.key === 'Escape') { e.stopPropagation(); closeMenu(); } }
function openMenu(anchor, items){
  closeMenu();
  const m = document.createElement('div');
  m.className = 'menu'; m.setAttribute('role', 'menu');
  items.forEach(it => {
    const b = document.createElement('button');
    b.className = 'menu-item' + (it.danger ? ' danger' : '');
    b.setAttribute('role', 'menuitem');
    b.textContent = it.label;
    b.onclick = () => { closeMenu(); it.run(); };
    m.appendChild(b);
  });
  document.body.appendChild(m);
  const r = anchor.getBoundingClientRect();
  const mw = m.offsetWidth, mh = m.offsetHeight;
  let left = Math.max(8, Math.min(r.right - mw, innerWidth - mw - 8));
  let top = r.bottom + 6;
  if (top + mh > innerHeight - 8) top = Math.max(8, r.top - mh - 6);
  m.style.left = left + 'px'; m.style.top = top + 'px';
  menuEl = m;
  m.querySelector('button').focus();
  setTimeout(() => {
    document.addEventListener('pointerdown', menuOutside, true);
    document.addEventListener('keydown', menuKey, true);
  }, 0);
}

function modal(build){
  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  const sheet = document.createElement('div');
  sheet.className = 'sheet';
  sheet.setAttribute('role', 'dialog');
  sheet.setAttribute('aria-modal', 'true');
  scrim.appendChild(sheet);
  document.body.appendChild(scrim);
  const prev = document.activeElement;
  let onClose = null, closed = false;
  const key = e => { if (e.key === 'Escape') { e.preventDefault(); close(); } };
  function close(){
    if (closed) return; closed = true;
    document.removeEventListener('keydown', key);
    scrim.classList.add('out');
    setTimeout(() => scrim.remove(), 150);
    if (onClose) onClose();
    if (prev && prev.focus && document.contains(prev)) prev.focus();
  }
  document.addEventListener('keydown', key);
  scrim.addEventListener('pointerdown', e => { if (e.target === scrim) close(); });
  build(sheet, close, fn => { onClose = fn; });
  return close;
}

function ask({ title, value = '', placeholder = '', ok = 'Зберегти' }){
  return new Promise(res => {
    let done = false;
    modal((sheet, close, setOnClose) => {
      sheet.innerHTML = '<h2 class="sheet-title"></h2><input class="field" maxlength="60" autocomplete="off">' +
        '<div class="sheet-actions"><button class="btn ghost" data-x>Скасувати</button><button class="btn primary" data-ok></button></div>';
      sheet.querySelector('h2').textContent = title;
      const inp = sheet.querySelector('input');
      inp.value = value; inp.placeholder = placeholder;
      sheet.querySelector('[data-ok]').textContent = ok;
      const submit = () => {
        const v = inp.value.trim().replace(/\s+/g, ' ');
        if (!v) { inp.classList.add('err'); inp.focus(); return; }
        done = true; res(v); close();
      };
      inp.addEventListener('input', () => inp.classList.remove('err'));
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
      sheet.querySelector('[data-ok]').onclick = submit;
      sheet.querySelector('[data-x]').onclick = close;
      setOnClose(() => { if (!done) res(null); });
      setTimeout(() => { inp.focus(); inp.select(); }, 30);
    });
  });
}

function confirmDialog({ title, text, ok, danger }){
  return new Promise(res => {
    let done = false;
    modal((sheet, close, setOnClose) => {
      sheet.innerHTML = '<h2 class="sheet-title"></h2><p class="sheet-text"></p>' +
        '<div class="sheet-actions"><button class="btn ghost" data-x>Скасувати</button><button class="btn" data-ok></button></div>';
      sheet.querySelector('h2').textContent = title;
      sheet.querySelector('p').textContent = text;
      const okb = sheet.querySelector('[data-ok]');
      okb.textContent = ok; okb.classList.add(danger ? 'danger' : 'primary');
      okb.onclick = () => { done = true; res(true); close(); };
      sheet.querySelector('[data-x]').onclick = close;
      setOnClose(() => { if (!done) res(false); });
      setTimeout(() => sheet.querySelector('[data-x]').focus(), 30);
    });
  });
}

function addStudentsDialog(){
  const g0 = activeGroup(); if (!g0 || readOnly) return;
  const gid = g0.id;
  modal((sheet, close) => {
    sheet.innerHTML =
      '<h2 class="sheet-title"></h2>' +
      '<div class="seg" role="tablist"><button data-mode="one" class="on">По одному</button><button data-mode="many">Списком</button></div>' +
      '<input class="field" data-one maxlength="60" placeholder="Прізвище та імʼя" autocomplete="off">' +
      '<textarea class="field" data-many rows="8" placeholder="Вставте список: кожен рядок — окремий студент" hidden></textarea>' +
      '<p class="hint" data-hint>Enter — додати й одразу вписати наступного</p>' +
      '<div class="sheet-actions"><button class="btn ghost" data-x>Готово</button><button class="btn primary" data-ok>Додати</button></div>';
    sheet.querySelector('h2').textContent = 'Студенти групи ' + g0.name;
    const one = sheet.querySelector('[data-one]'), many = sheet.querySelector('[data-many]');
    const hint = sheet.querySelector('[data-hint]');
    let mode = 'one';
    const setMode = m => {
      mode = m;
      sheet.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
      one.hidden = m !== 'one'; many.hidden = m !== 'many';
      hint.className = 'hint';
      hint.textContent = m === 'one' ? 'Enter — додати й одразу вписати наступного' : 'Ctrl+Enter — додати всіх';
      (m === 'one' ? one : many).focus();
    };
    sheet.querySelectorAll('.seg button').forEach(b => b.onclick = () => setMode(b.dataset.mode));

    const submit = () => {
      const g = groups.find(x => x.id === gid);
      if (!g) { close(); return; }
      const raw = mode === 'one' ? [one.value] : many.value.split(/\r?\n/);
      const have = new Set(g.students.map(s => s.name.toLocaleLowerCase('uk')));
      const names = [], skipped = [];
      raw.map(v => v.replace(/^\s*\d+[.)]\s*/, '').trim().replace(/\s+/g, ' ')).filter(Boolean).forEach(n => {
        const k = n.toLocaleLowerCase('uk');
        if (have.has(k)) skipped.push(n); else { have.add(k); names.push(n.slice(0, 60)); }
      });
      if (!names.length) {
        hint.className = 'hint';
        hint.textContent = skipped.length ? 'Уже є в групі: ' + skipped.join(', ') : 'Впишіть імʼя';
        (mode === 'one' ? one : many).focus();
        return;
      }
      mutate(names.length === 1 ? 'додано ' + names[0] : 'додано ' + names.length + ' ' + plural(names.length, STUD), [gid], () => {
        names.forEach(n => g.students.push({ id: uid(), name: n, score: 0, picks: 0, log: [] }));
      });
      renderHeader(); renderList(); renderTabs();
      if (mode === 'one') {
        one.value = '';
        hint.className = 'hint ok';
        hint.textContent = 'Додано: ' + names[0] + (skipped.length ? ' (уже є: ' + skipped.join(', ') + ')' : '');
        one.focus();
      } else {
        close();
        toast('Додано ' + names.length + ' ' + plural(names.length, STUD) + (skipped.length ? ', пропущено повтори: ' + skipped.length : ''));
      }
    };
    one.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
    many.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); submit(); } });
    sheet.querySelector('[data-ok]').onclick = submit;
    sheet.querySelector('[data-x]').onclick = close;
    setTimeout(() => one.focus(), 30);
  });
}

function historyDialog(sid){
  const g = activeGroup(); if (!g) return;
  const s = g.students.find(x => x.id === sid); if (!s) return;
  modal((sheet, close) => {
    sheet.innerHTML = '<h2 class="sheet-title"></h2><p class="sheet-text"></p><ul class="hist"></ul>' +
      '<div class="sheet-actions"><button class="btn primary" data-x>Закрити</button></div>';

    sheet.querySelector('p').textContent = s.score + ' ' + plural(s.score, PTS) + ', викликали ' + s.picks + ' ' + plural(s.picks, TIMES);
    const ul = sheet.querySelector('ul');
    const fmt = t => {
      const d = new Date(t), p = n => String(n).padStart(2, '0');
      return p(d.getDate()) + '.' + p(d.getMonth() + 1) + ', ' + p(d.getHours()) + ':' + p(d.getMinutes());
    };
    if (!s.log.length) {
      const li = document.createElement('li'); li.innerHTML = '<span class="t">Змін ще не було</span>'; ul.appendChild(li);
    }
    [...s.log].reverse().forEach(e => {
      const li = document.createElement('li');
      const d = document.createElement('span');
      d.className = 'd ' + (e.d > 0 ? 'up' : 'down');
      d.textContent = e.r ? 'Обнулено' : (e.d > 0 ? '+' + e.d : '−' + Math.abs(e.d));
      const t = document.createElement('span'); t.className = 't'; t.textContent = fmt(e.t);
      li.append(d, t); ul.appendChild(li);
    });
    sheet.querySelector('[data-x]').onclick = close;
    setTimeout(() => sheet.querySelector('[data-x]').focus(), 30);
  });
}

function pickerDialog(){
  const g0 = activeGroup(); if (!g0 || !g0.students.length || readOnly) return;
  const gid = g0.id;
  modal((sheet, close, setOnClose) => {
    sheet.innerHTML =
      '<h2 class="sheet-title">Хто відповідає?</h2>' +
      '<div class="slot"><div class="slot-name idle">Натисніть «Крутити»</div></div>' +
      '<p class="slot-sub">&nbsp;</p>' +
      '<label class="check"><input type="checkbox" checked> Частіше випадають ті, кого рідше викликали</label>' +
      '<div class="sheet-actions picker-actions">' +
        '<button class="btn icon" data-minus disabled aria-label="Мінус бал">−1</button>' +
        '<button class="btn primary" data-spin>Крутити</button>' +
        '<button class="btn icon" data-plus disabled aria-label="Плюс бал" style="color:var(--gold-hi);border-color:var(--gold-lo)">+1</button>' +
      '</div>';
    const slot = sheet.querySelector('.slot'), nameEl = sheet.querySelector('.slot-name');
    const sub = sheet.querySelector('.slot-sub'), fair = sheet.querySelector('input');
    const bMinus = sheet.querySelector('[data-minus]'), bPlus = sheet.querySelector('[data-plus]'), bSpin = sheet.querySelector('[data-spin]');
    let chosenId = null, spinning = false, alive = true;
    setOnClose(() => { alive = false; });

    const students = () => (groups.find(x => x.id === gid) || { students: [] }).students;

    function choose(list){
      const w = list.map(s => fair.checked ? 1 / Math.pow(1 + s.picks, 1.6) : 1);
      let r = Math.random() * w.reduce((a, b) => a + b, 0);
      for (let i = 0; i < list.length; i++) { r -= w[i]; if (r <= 0) return list[i]; }
      return list[list.length - 1];
    }

    async function spin(){
      const list = students();
      if (!list.length || spinning) return;
      spinning = true; bSpin.disabled = true; bPlus.disabled = bMinus.disabled = true;
      slot.classList.remove('landed'); sub.innerHTML = '&nbsp;'; nameEl.classList.remove('idle');
      const target = choose(list);
      if (!reduced && list.length > 1) {
        const ticks = 24; let last = null;
        for (let i = 0; i < ticks && alive; i++) {
          let s; do { s = list[Math.floor(Math.random() * list.length)]; } while (list.length > 1 && s === last);
          last = s;
          const d = 38 + 330 * Math.pow(i / ticks, 3);
          nameEl.style.setProperty('--d', Math.min(d, 160) + 'ms');
          nameEl.textContent = s.name; restartClass(nameEl, 'tick');
          await sleep(d);
        }
      }
      if (!alive) return;
      nameEl.classList.remove('tick');
      nameEl.textContent = target.name;
      slot.classList.add('landed');
      chosenId = target.id;
      const g = groups.find(x => x.id === gid);
      const cs = g && g.students.find(x => x.id === target.id);
      if (cs) mutate('виклик ' + cs.name, [gid], () => { cs.picks += 1; });
      updateSub();
      burstAt(slot, 16);
      spinning = false; bSpin.disabled = false; bSpin.textContent = 'Ще раз';
      bPlus.disabled = bMinus.disabled = false;
    }
    function updateSub(){
      const s = students().find(x => x.id === chosenId);
      if (!s) return;
      sub.textContent = s.score + ' ' + plural(s.score, PTS) + ', викликали ' + s.picks + ' ' + plural(s.picks, TIMES);
    }
    bSpin.onclick = spin;
    bPlus.onclick = () => { if (!chosenId) return; change(chosenId, 1, bPlus); updateSub(); bPlus.disabled = bMinus.disabled = true; };
    bMinus.onclick = () => { if (!chosenId) return; change(chosenId, -1, bMinus); updateSub(); bPlus.disabled = bMinus.disabled = true; };
    setTimeout(() => bSpin.focus(), 30);
  });
}

$('#heroAdd').onclick = newGroup;
$('#addBtn').onclick = addStudentsDialog;
$('#emptyAdd').onclick = addStudentsDialog;
$('#pickBtn').onclick = pickerDialog;
$('#undoBtn').onclick = undo;
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || document.querySelector('.scrim')) return;
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
});

/* ================= boot ================= */
loadLocal();
const onClaude = !!(window.claude && typeof window.claude.use === 'function');
if (!onClaude) { readOnly = !lsGet(LS_TOKEN); store.mode = readOnly ? 'view' : 'gh'; }
START_GROUP = urlName();
if (urlGroup()) pickFromHash();
else if (readOnly && meStudent()) activeId = me.g;
if (!activeGroup()) activeId = groups[0] ? groups[0].id : null;
if (!groups.length) store.pending = true;
renderAll();
updateUndo();

$('#authBtn').onclick = authClick;
$('#meChange').onclick = () => whoDialog(null);
window.addEventListener('hashchange', () => { const was = activeId; pickFromHash(); if (activeId !== was) renderAll(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (store.mode === 'gh' && dirty.size && !gh.saving) { clearTimeout(gh.timer); gh.timer = null; ghSave(); } return; }
  if (store.mode === 'view') viewerPull();
  else if (store.mode === 'gh' && !dirty.size && !gh.saving) ownerPull().catch(() => {});
});
window.addEventListener('beforeunload', e => { if (store.mode === 'gh' && dirty.size) { e.preventDefault(); e.returnValue = ''; } });

(async () => {
  const cl = window.claude;
  if (!cl || typeof cl.use !== 'function') {
    // звичайний сайт (GitHub Pages): викладач — якщо на пристрої є токен, інакше перегляд
    const token = lsGet(LS_TOKEN);
    if (token) { await enterOwner(token); return; }
    enterView();
    return;
  }
  let db = null, user = null;
  try { [db, user] = await Promise.all([cl.use('db'), cl.use('user')]); } catch {}
  if (user) {
    try { if ((await user.canEdit()) === false) setReadOnly(true); } catch {}
  }
  if (!db) { store.pending = false; renderAll(); return; }
  store.db = db; store.mode = 'db';
  const subscribe = () => db.collection('groups').onSnapshot(onGroups, err => {
    if (err && err.code === 'unavailable') setTimeout(subscribe, 2000);
    else { store.pending = false; renderAll(); }
  });
  subscribe();
  setTimeout(() => { if (store.pending) { store.pending = false; renderAll(); } }, 8000);
})();
})();
</script>
</body>
</html>
